<div *ngIf="emailEnviado" class="verify-message">
  <span class="material-icons">mark_email_unread</span>
  <h2>Verifique seu email!</h2>
  <p>Enviamos um link de verificação para <strong>{{ emailCadastrado }}</strong></p>
  <p>Clique no link para ativar sua conta e fazer login.</p>
  <button (click)="navigate()">Ir para o Login</button>
</div>

<app-default-login-layout *ngIf="!emailEnviado"
title="Sign in and start today!"
primaryBtnText="Signup Now"
secondaryBtnText="Login Now"
(submit)="submit()"
(navigate)="navigate()"
[disablePrimaryBtn]="!signupForm.valid"
>
<form [formGroup]="signupForm">
    <app-primary-input
    formControlName="name"
    inputName="name"
    type="text"
    label="Your Name"
    placeholder="Jonh Doe">
        <img src="./assets/svg/email-icon.svg" selector="icon"/>
    </app-primary-input>
    <app-primary-input
    formControlName="email"
    inputName="email"
    type="email"
    label="Email"
    placeholder="jonhdoe@gmail.com">
        <img src="./assets/svg/email-icon.svg" selector="icon"/>
    </app-primary-input>
    <app-primary-input
    formControlName="password"
    inputName="password"
    type="password"
    label="Password"
    placeholder="Enter your password">
        <img src="./assets/svg/password-icon.svg" selector="icon"/>
    </app-primary-input>
    <app-primary-input
    formControlName="passwordConfirm"
    inputName="passwordConfirm"
    type="password"
    label="Confirm your Password"
    placeholder="Enter your password">
        <img src="./assets/svg/password-icon.svg" selector="icon"/>
    </app-primary-input>
</form>
</app-default-login-layout>
